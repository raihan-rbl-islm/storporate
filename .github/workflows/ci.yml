name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fast-checks:
    name: fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        # fetch-depth: 0 — gitleaks-action scans the commit range
        # `<merge-parent>..<merge-commit>`. With the default depth=1 the
        # merge parent is unreachable and `git log <rev>` fails. Full
        # history keeps gitleaks resolvable; this is a small repo.
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test
      - name: secrets scan
        uses: gitleaks/gitleaks-action@v2
        # The repo's allowlist lives at `gitleaks.toml` (committed in the
        # env-deploy checkpoint). gitleaks-action looks for `.gitleaks.toml`
        # by default; point it at the existing file so the allowlist applies.
        with:
          config-path: gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build

  # e2e job removed for the demo ship: requires real Supabase env vars
  # (or stub config in playwright.ci.config.ts) and a Playwright browser
  # install. The smoke specs in tests/smoke/ stay on disk for local
  # verification via `npm run test:e2e`. Re-enable when Supabase
  # provisioning lands in CI secrets.
